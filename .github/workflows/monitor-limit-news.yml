name: Monitor limit news

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor-limit-news
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check sources
        run: python3 announcements/monitor/check_sources.py --report limit-news-report.md

      - name: Open review issue
        if: ${{ hashFiles('limit-news-report.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Possible usage-limit news ($(date -u +%F))" \
            --body-file limit-news-report.md

      - name: Commit updated snapshots
        run: |
          if [[ -n "$(git status --porcelain announcements/monitor/snapshots)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add announcements/monitor/snapshots
            git commit -m "monitor: update source snapshots [skip ci]"
            git push
          fi
