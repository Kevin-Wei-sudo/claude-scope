name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    outputs:
      pages_enabled: ${{ steps.configure_pages.outcome == 'success' && 'true' || 'false' }}
    env:
      REPOSITORY_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        id: configure_pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Build release app bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          export APP_VERSION="$version"
          export SU_FEED_URL="https://${owner}.github.io/${REPOSITORY_NAME}/appcast.xml"
          bash macos/scripts/build.sh

      - name: Package and verify release artifacts
        env:
          EXPECT_FEED_URL: '1'
        run: |
          bash macos/scripts/build.sh --skip-build --zip --dmg
          make verify-release

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/archives dist/site

          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            --method POST \
            -f tag_name="${GITHUB_REF_NAME}" \
            --jq '.body' > dist/generated-notes.md

          # generate-notes only lists merged PRs; prepend commit subjects so
          # releases cut from direct pushes still describe what changed.
          prev_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [[ -n "$prev_tag" ]]; then
            commit_range="${prev_tag}..${GITHUB_REF_NAME}"
          else
            commit_range="${GITHUB_REF_NAME}"
          fi

          {
            echo "## Changes"
            echo
            git log --no-merges --pretty='- %s' "$commit_range"
            echo
            cat dist/generated-notes.md
          } > dist/release-notes.md

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          with open("dist/release-notes.md", "r", encoding="utf-8") as fh:
              markdown = fh.read()

          request = urllib.request.Request(
              "https://api.github.com/markdown",
              data=json.dumps({
                  "text": markdown,
                  "mode": "gfm",
                  "context": os.environ["GITHUB_REPOSITORY"],
              }).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )

          with urllib.request.urlopen(request) as response:
              html = response.read().decode("utf-8")

          with open("dist/archives/ClaudeScope.html", "w", encoding="utf-8") as fh:
              fh.write(html)
          PY

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos/ClaudeScope.zip
            macos/ClaudeScope.dmg
          body_path: dist/release-notes.md

      - name: Generate Sparkle appcast
        if: ${{ always() && steps.configure_pages.outcome != 'cancelled' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "${SPARKLE_PRIVATE_KEY:-}" ]]; then
            echo "::error::Missing SPARKLE_PRIVATE_KEY repository secret."
            exit 1
          fi

          cp macos/ClaudeScope.zip dist/archives/ClaudeScope.zip

          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            macos/.build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              dist/archives \
              --ed-key-file - \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
              --maximum-deltas 0 \
              -o dist/site/appcast.xml

      - name: Publish appcast to main
        # Pages has flipped between workflow and branch builds before; a copy
        # committed to main serves correctly in either mode.
        run: |
          git fetch origin main
          git checkout -B appcast-publish origin/main
          cp dist/site/appcast.xml appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          if git commit -m "appcast: ${GITHUB_REF_NAME} [skip ci]"; then
            git push origin appcast-publish:main
          fi
          git checkout --detach "${GITHUB_REF_NAME}"

      - name: Upload appcast for GitHub Pages
        if: steps.configure_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy_appcast:
    needs: release
    if: needs.release.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy appcast
        id: deployment
        uses: actions/deploy-pages@v4
